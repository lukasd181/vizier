[project]
name = "the-chancellor"
version = "0.1.0"
description = "Vizier: a standalone Civ 6 mentor MCP server — fog-filtered turn reviews, fix-it options and goal tracking for human players"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # mcp 2.x renamed FastMCP; the server is written against 1.x.
    "mcp>=1.26,<2",
]

[project.scripts]
chancellor-mcp = "chancellor.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chancellor"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0", "lupa>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
